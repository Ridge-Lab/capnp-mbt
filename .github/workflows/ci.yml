name: Cap'n Proto checks
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --release
      - run: moon run --target ${{ matrix.target }} examples/roundtrip
  windows-node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon build --target js --release
      - run: python -m pip install -r examples/telemetry/requirements.txt
      - run: python examples/streaming/peer.py --jobs 128 --output work/stream-windows -- node _build/js/release/build/examples/streaming/streaming.js
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pinned Cap'n Proto 1.5.0 reference compiler
        run: |
          curl -L --fail --retry 3 https://capnproto.org/capnproto-c++-1.5.0.tar.gz -o "$RUNNER_TEMP/capnproto.tar.gz"
          echo "77dbc13ca82d9c87ddb4581dd49559d45b63096433d3dadea08b7f31b360a5ba  $RUNNER_TEMP/capnproto.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/capnproto.tar.gz" -C "$RUNNER_TEMP"
          for file in c++.capnp schema.capnp stream.capnp test.capnp test-import.capnp test-import2.capnp testdata/binary testdata/packed testdata/short.txt; do
            cmp "$RUNNER_TEMP/capnproto-c++-1.5.0/src/capnp/$file" "fixtures/upstream/capnproto-1.5.0/capnp/$file"
          done
          cmp "$RUNNER_TEMP/capnproto-c++-1.5.0/LICENSE.txt" fixtures/upstream/capnproto-1.5.0/LICENSE.txt
          cmake -S "$RUNNER_TEMP/capnproto-c++-1.5.0" -B "$RUNNER_TEMP/capnp-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DWITH_OPENSSL=OFF -DWITH_ZLIB=OFF
          cmake --build "$RUNNER_TEMP/capnp-build" --target capnp_tool --parallel 2
          echo "$RUNNER_TEMP/capnp-build/src/capnp" >> "$GITHUB_PATH"
      - run: capnp --version
      - run: python -m pip install -r examples/telemetry/requirements.txt
      - run: moon update
      - run: moon build --target native --release cmd/capnpc-moonbit
      - name: Reproduce committed generated API fixtures
        run: |
          moon run --target native cmd/capnpc-moonbit -- --request fixtures/conformance.request.bin --out tests/generated
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/advanced.request.bin --out tests/generated/advanced
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/names.request.bin --out tests/generated/names
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/generic.request.bin --out tests/generated/generic
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/brands.request.bin --out tests/generated/brands
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/growing.request.bin --out tests/generated/growing
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/collision-compat.request.bin --out tests/generated/collision_compat
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/long-text.request.bin --out tests/generated/long_text
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/upstream.request.bin --out tests/generated/upstream
          moon run --target native cmd/capnpc-moonbit -- --request codegen/fixtures/compiler.request.bin --out tests/generated/compiler
          moon fmt
          git diff --exit-code -- tests/generated
      - name: Generate types using the actual compiler plugin protocol
        run: capnp compile -o./_build/native/release/build/cmd/capnpc-moonbit/capnpc-moonbit.exe:examples/telemetry/generated examples/telemetry/schema/telemetry.capnp
      - name: Check regenerated code and examples
        run: moon check --target native --deny-warn
      - name: MoonBit to independent Python/C++ peer
        run: |
          mkdir -p work
          moon run --target native examples/telemetry -- produce work/batch.bin
          python examples/telemetry/worker.py work/batch.bin work/report.bin
          moon run --target native examples/telemetry -- verify work/report.bin
      - name: Official compiler reads MoonBit packed output
        run: |
          moon run --target native cmd/packing -- pack work/batch.bin work/batch.packed.bin
          capnp decode --packed examples/telemetry/schema/telemetry.capnp Batch < work/batch.packed.bin
      - name: Check a real compiler request on Node.js
        run: moon run --target js cmd/capnpc-moonbit -- --request fixtures/conformance.request.bin --out work/generated
      - name: Compile the unchanged upstream test and compiler schemas
        run: |
          capnp compile --no-standard-import -Ifixtures/upstream/capnproto-1.5.0 --src-prefix=fixtures/upstream/capnproto-1.5.0 -o./_build/native/release/build/cmd/capnpc-moonbit/capnpc-moonbit.exe:tests/generated/upstream fixtures/upstream/capnproto-1.5.0/capnp/test.capnp
          capnp compile --no-standard-import -Ifixtures/upstream/capnproto-1.5.0 --src-prefix=fixtures/upstream/capnproto-1.5.0 -o./_build/native/release/build/cmd/capnpc-moonbit/capnpc-moonbit.exe:tests/generated/compiler fixtures/upstream/capnproto-1.5.0/capnp/schema.capnp
          moon fmt
          git diff --exit-code -- tests/generated/upstream tests/generated/compiler
      - name: Compile valid schemas with colliding generated names
        run: |
          capnp compile -o./_build/native/release/build/cmd/capnpc-moonbit/capnpc-moonbit.exe:tests/generated/collision_compat codegen/fixtures/collision-compat.capnp
          moon fmt
          git diff --exit-code -- tests/generated/collision_compat
      - name: Compile large Unicode Text constants and defaults
        run: |
          capnp compile -o./_build/native/release/build/cmd/capnpc-moonbit/capnpc-moonbit.exe:tests/generated/long_text codegen/fixtures/long-text.capnp
          moon fmt
          git diff --exit-code -- tests/generated/long_text
      - name: Bidirectional generics AnyPointer and constants interoperability
        run: |
          python examples/schema_compat/peer.py prepare work/schema-compat
          moon run --target native examples/schema_compat -- work/schema-compat
          python examples/schema_compat/peer.py verify work/schema-compat
          moon run --target js examples/schema_compat -- work/schema-compat
          python examples/schema_compat/peer.py verify work/schema-compat
      - name: Process fragmented multi-message streams with independent verification
        run: |
          moon build --target native --release examples/streaming
          moon build --target js --release examples/streaming
          python examples/streaming/peer.py --jobs 128 --output work/stream-native -- _build/native/release/build/examples/streaming/streaming.exe
          python examples/streaming/peer.py --jobs 128 --output work/stream-js -- node _build/js/release/build/examples/streaming/streaming.js
      - name: Check benchmark execution and raw timing validation
        run: python scripts/run_benchmarks.py --targets native js --samples 1 32 --round-ms 5 --warmup-ms 5 --rounds 3 --output work/benchmark-smoke.json
      - name: Reproduce canonical encoding with the official converter
        run: |
          for source in fixtures/conformance.bin fixtures/conformance.segmented.bin; do
            capnp convert binary:canonical < "$source" > work/canonical.bin
            cmp fixtures/conformance.canonical.bin work/canonical.bin
          done
          for canonical in fixtures/upstream/oracle-1.5.0/*.canonical.bin; do
            source="${canonical%.canonical.bin}.bin"
            capnp convert binary:canonical < "$source" > work/canonical.bin
            cmp "$canonical" work/canonical.bin
          done
      - name: Install the published package in a fresh consumer
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: interoperability-results
          path: |
            work/batch.bin
            work/report.bin
            work/batch.packed.bin
            work/schema-compat/
            work/stream-native/
            work/stream-js/
            work/benchmark-smoke.json
