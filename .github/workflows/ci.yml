name: Cap'n Proto checks
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
        sdk: ["0.10.20+65efd5b93"]
        include:
          - target: js
            sdk: "0.10.16+b1a0e846e"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: ${{ matrix.sdk }}
          core-version: ${{ matrix.sdk }}
      - run: moon version --all
      - run: moon update
      - run: python scripts/verify.py --profile quick --targets ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-linux-${{ matrix.target }}-${{ matrix.sdk }}
          path: work/verification/
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.20+65efd5b93"
          core-version: "0.10.20+65efd5b93"
      - run: moon version --all
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target == 'native'
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: moon update
      - run: python scripts/verify.py --profile quick --targets ${{ matrix.target }}
      - run: python -m pip install -r examples/telemetry/requirements.txt
      - run: python examples/streaming/peer.py --jobs 128 --output work/stream-windows -- node _build/js/release/build/examples/streaming/streaming.js
        if: matrix.target == 'js'
      - run: python examples/streaming/peer.py --jobs 128 --output work/stream-windows-native -- _build/native/release/build/examples/streaming/streaming.exe
        if: matrix.target == 'native'
      - run: python examples/streaming/peer.py --packed --jobs 128 --output work/stream-windows-packed -- node _build/js/release/build/examples/streaming/streaming.js --packed
        if: matrix.target == 'js'
      - run: python examples/streaming/peer.py --packed --jobs 128 --output work/stream-windows-native-packed -- _build/native/release/build/examples/streaming/streaming.exe --packed
        if: matrix.target == 'native'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-windows-${{ matrix.target }}
          path: |
            work/verification/
            work/stream-windows*/
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.20+65efd5b93"
          core-version: "0.10.20+65efd5b93"
      - run: moon version --all
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pinned Cap'n Proto 1.5.0 reference compiler
        run: |
          curl -L --fail --retry 3 https://capnproto.org/capnproto-c++-1.5.0.tar.gz -o "$RUNNER_TEMP/capnproto.tar.gz"
          echo "77dbc13ca82d9c87ddb4581dd49559d45b63096433d3dadea08b7f31b360a5ba  $RUNNER_TEMP/capnproto.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/capnproto.tar.gz" -C "$RUNNER_TEMP"
          for file in c++.capnp schema.capnp stream.capnp test.capnp test-import.capnp test-import2.capnp testdata/binary testdata/packed testdata/short.txt; do
            cmp "$RUNNER_TEMP/capnproto-c++-1.5.0/src/capnp/$file" "fixtures/upstream/capnproto-1.5.0/capnp/$file"
          done
          cmp "$RUNNER_TEMP/capnproto-c++-1.5.0/LICENSE.txt" fixtures/upstream/capnproto-1.5.0/LICENSE.txt
          cmake -S "$RUNNER_TEMP/capnproto-c++-1.5.0" -B "$RUNNER_TEMP/capnp-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DWITH_OPENSSL=OFF -DWITH_ZLIB=OFF
          cmake --build "$RUNNER_TEMP/capnp-build" --target capnp_tool --parallel 2
          echo "$RUNNER_TEMP/capnp-build/src/capnp" >> "$GITHUB_PATH"
      - run: capnp --version
      - run: python -m pip install -r examples/telemetry/requirements.txt
      - run: moon update
      - name: Reproduce runtime, compiler protocol, both peers and benchmarks
        run: python scripts/verify.py --profile full --targets js native
      - name: Install the published package in a fresh consumer
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify.py --profile release --version 0.4.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interoperability-results
          path: work/verification/
